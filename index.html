<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonction d'onde f(x − vt) · SFA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>

<style>*{box-sizing:border-box;margin:0;padding:0;}body{background:#fff;font-family:system-ui,-apple-system,sans-serif;}</style>
<style id="sfa-kit">
/* Kit SFA (clair) — plan blanc sur fond gris-bleu froid, encre bleu nuit, or en accent unique, réglages en règle graduée. */
:root{--bg:#f3f5f8;--paper:#ffffff;--ink:#0c1f2e;--muted:#5b6b7b;--faint:#8a98a6;--rule:#dfe4ea;--rule2:#c9d1da;
  --gold:#d9973f;--gold-ink:#9a6420;--press:#e9edf2;
  --f-ui:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;--f-math:"STIX Two Text","Cambria Math",serif;
  --f-num:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}
html{background:var(--bg)}
body{background:var(--bg)!important;color:var(--ink);font-family:var(--f-ui)!important;font-size:15px;line-height:1.5;
  max-width:1180px;margin:0 auto!important;padding:20px 16px 32px!important}
.sfa-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px;
  border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:16px}
.sfa-head h1{font:700 1.5rem/1.2 var(--f-ui);margin:0;letter-spacing:-.005em;text-wrap:balance}
.sfa-head h1 small{display:block;font:400 .88rem var(--f-ui);color:var(--muted);margin-top:3px}
.sfa-head .sfa-tag{font:600 .8rem var(--f-ui);color:var(--muted)}
.sfa-head .sfa-tag b{color:var(--gold-ink);font-weight:700}
select{font:500 .86rem var(--f-ui)!important;border:1px solid var(--rule2)!important;border-radius:3px!important;background:var(--paper)!important;color:var(--ink)!important;padding:5px 8px!important}
.sfa-stage{border:1px solid var(--rule)!important;border-radius:4px!important;box-shadow:0 1px 2px rgba(12,31,46,.05),0 8px 24px -16px rgba(12,31,46,.18)}
.sfa-stage canvas{border:0!important;box-shadow:none!important}
canvas{background:var(--paper);border:1px solid var(--rule)!important;border-radius:4px!important;box-shadow:0 1px 2px rgba(12,31,46,.05),0 8px 24px -16px rgba(12,31,46,.18)}
.row{gap:12px!important;margin:10px 0!important}
.pill,.lbl,.tag{background:none!important;border:0!important;border-radius:0!important;padding:0!important;
  font:600 .86rem var(--f-ui)!important;color:var(--muted);min-width:0}
.val{background:none!important;border:0!important;border-radius:0!important;padding:0!important;
  font:500 .9rem var(--f-num)!important;font-variant-numeric:tabular-nums;text-align:right}
.btn{background:transparent!important;border:1px solid var(--rule2)!important;border-radius:3px!important;color:var(--muted)!important;
  font:600 .82rem var(--f-ui)!important;padding:6px 12px!important;transition:color .15s,background .15s}
.btn:hover{color:var(--ink)!important;background:var(--press)!important}
.btn.on{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important;box-shadow:inset 0 -2px 0 var(--gold)}
.fml{background:transparent!important;border:0!important;border-left:2px solid var(--gold)!important;border-radius:0!important;
  font:400 1.08rem/1.7 var(--f-math)!important;color:var(--ink);padding:4px 0 4px 14px!important;margin:14px 0!important}
.info{background:var(--paper)!important;border:1px solid var(--rule)!important;border-radius:3px!important;
  font:500 .84rem/1.8 var(--f-num)!important;color:var(--muted)!important;padding:8px 14px!important}
input[type=range]{-webkit-appearance:none;appearance:none;height:24px;background:linear-gradient(var(--rule2),var(--rule2)) center/100% 2px no-repeat;cursor:pointer;--pc:var(--gold)}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:transparent}
input[type=range]::-moz-range-track{height:2px;background:transparent}
input[type=range]::-moz-range-progress{height:2px;background:var(--pc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:20px;border-radius:1px;background:var(--pc);margin-top:-9px;border:0}
input[type=range]::-moz-range-thumb{width:6px;height:20px;border-radius:1px;background:var(--pc);border:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sfa-foot{margin-top:22px;padding-top:10px;border-top:1px solid var(--rule);font-size:.78rem;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
/* Curseurs : la couleur du curseur reprend celle de son accent-color d'origine ; remplissage gauche en couleur. */
addEventListener('DOMContentLoaded',()=>{
/* Curseurs : couleur reprise de accent-color, remplissage à gauche. Resynchronisé en continu pour suivre
   les curseurs créés ou déplacés par la simulation elle-même. */
const fill=r=>{if(!r.dataset.sfa){r.dataset.sfa=1;const c=r.style.accentColor||getComputedStyle(r).accentColor;
    if(c&&c!=='auto')r.style.setProperty('--pc',c);}
  const v=r.value+'|'+r.min+'|'+r.max;if(r._sv===v)return;r._sv=v;
  const p=(r.value-r.min)/(r.max-r.min)*100;
  r.style.background=`linear-gradient(to right,var(--pc) ${p}%,var(--rule2) ${p}%) center/100% 2px no-repeat`;};
const all=()=>document.querySelectorAll('input[type=range]').forEach(fill);
all();document.addEventListener('input',e=>{if(e.target.matches&&e.target.matches('input[type=range]'))fill(e.target);});
setInterval(all,150);
/* Contrôles écrits en style en ligne (sans classe) : on leur donne les classes du kit. */
const st=e=>(e.getAttribute('style')||'').replace(/\s/g,'').toLowerCase();
const isPill=e=>/border-radius:(1[6-9]|20|99)px/.test(st(e));
document.querySelectorAll('span').forEach(sp=>{if(sp.classList.length||!isPill(sp))return;
  const n=sp.nextElementSibling,pv=sp.previousElementSibling;
  if(n&&n.matches('input[type=range],select,button'))sp.classList.add('pill');
  else if(pv&&pv.matches('input[type=range],select'))sp.classList.add('val');
  else sp.classList.add('pill');});
document.querySelectorAll('div').forEach(d=>{if(d.classList.length)return;const s=st(d);
  if(/border-radius:(1[6-9]|20)px/.test(s)&&/monospace/.test(s))d.classList.add(d.id==='fml'?'fml':'info');
  else if(d.querySelector(':scope>canvas')&&/border-radius:1[0-4]px/.test(s))d.classList.add('sfa-stage');});
const tag=b=>{const s=st(b);b.classList.toggle('on',/#185fa5|rgb\(24,95,165\)/.test(s)&&!/#fff[;f]|#ffffff|rgb\(255,255,255\)/.test(s.match(/background:[^;]+/)?.[0]||''));};
document.querySelectorAll('button:not(.btn)').forEach(b=>{b.classList.add('btn','sfa-n');tag(b);});
new MutationObserver(ms=>ms.forEach(m=>{if(m.target.classList&&m.target.classList.contains('sfa-n'))tag(m.target);}))
  .observe(document.body,{subtree:true,attributes:true,attributeFilter:['style']});
});
</script>
<header class="sfa-head"><h1>Fonction d'onde f(x − vt)<small>Translation d'un profil dans le temps</small></h1><span class="sfa-tag"><b>SFA</b> · Physique · Ondes</span></header>



<div style="width:100%;height:62vh;min-height:320px;position:relative;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#fff;border:1.5px solid #e8e8e8;">
  <canvas id="cv" style="position:absolute;top:0;left:0;width:100%;height:100%;display:block;"></canvas>
</div>

<div id="fml" style="font-size:13px;padding:10px 16px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#2c2c2a;margin:0 0 10px;font-family:ui-monospace,monospace;line-height:1.8;display:block;width:100%;">
  f(x − vt) = A · sin(k · (x − vt)) &nbsp;|&nbsp; profil translaté de vt
</div>

<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:120px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Forme d'onde</span>
  <select id="shape" style="flex:1;padding:7px 14px;border-radius:20px;border:1.5px solid #d0d0d0;background:#f5f5f5;font-size:13px;color:#2c2c2a;">
    <option value="sin">sinusoïde</option>
    <option value="gauss" selected>paquet gaussien</option>
    <option value="tri">triangulaire</option>
    <option value="rect">rectangulaire</option>
  </select>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:120px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Vitesse v</span>
  <input type="range" id="vel" min="0" max="5" value="1.5" step="0.5" style="flex:1;accent-color:#378ADD;">
  <span id="velv" style="min-width:52px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 12px;">1.5</span>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:120px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Temps t</span>
  <input type="range" id="tsl" min="0" max="400" value="0" step="1" style="flex:1;accent-color:#378ADD;">
  <span id="tslv" style="min-width:52px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 12px;">0</span>
</div>

<div style="display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap;">
  <button id="btn-p" onclick="togglePlay()" style="padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #185fa5;background:#e6f1fb;color:#185fa5;">Jouer</button>
  <button onclick="document.getElementById('tsl').value=0;tMan=0;sync();" style="padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #d0d0d0;background:#ffffff;color:#2c2c2a;">Réinitialiser t</button>
</div>

<script>
const cv=document.getElementById('cv');
let playing=false,animT=0,tMan=0,lastTs=null,raf;

document.getElementById('vel').addEventListener('input',()=>{document.getElementById('velv').textContent=document.getElementById('vel').value;sync();});
document.getElementById('tsl').addEventListener('input',()=>{tMan=parseFloat(document.getElementById('tsl').value);document.getElementById('tslv').textContent=Math.round(tMan);draw(tMan);});
document.getElementById('shape').addEventListener('change',()=>sync());

function sync(){draw(playing?animT:tMan);}

function togglePlay(){
  playing=!playing;
  const b=document.getElementById('btn-p');
  if(playing){
    b.textContent='Pause';
    b.style.cssText='padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #f09595;background:#fcebeb;color:#a32d2d;';
    lastTs=null;animT=tMan;loop();
  } else {
    b.textContent='Jouer';
    b.style.cssText='padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #185fa5;background:#e6f1fb;color:#185fa5;';
    tMan=animT;cancelAnimationFrame(raf);
  }
}

function waveFunc(u,shape,A,k){
  switch(shape){
    case'sin': return A*Math.sin(k*u);
    case'gauss': return A*Math.exp(-(u*u)/(55*55))*Math.sin(k*u);
    case'tri':{const T=2*Math.PI/k;const m=((u%T)+T)%T;const x=m/T;return A*(x<.5?4*x-1:3-4*x);}
    case'rect':{const T=2*Math.PI/k;const m=((u%T)+T)%T;return A*(m<T/2?.88:-.88);}
  }return 0;
}

function draw(t){
  const rect=cv.parentElement.getBoundingClientRect();
  const W=Math.round(rect.width)||700;
  const H=cv.parentElement.offsetHeight||320;
  cv.width=W; cv.height=H;

  const v=parseFloat(document.getElementById('vel').value);
  const k=2*0.025*Math.PI;
  const A=Math.min(H*0.32, 80);
  const shape=document.getElementById('shape').value;
  const cy=H/2;
  const sc=W/500;
  const ctx=cv.getContext('2d');

  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);

  // axe horizontal
  ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=0.8; ctx.setLineDash([3,8]);
  ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.stroke(); ctx.setLineDash([]);

  // f(x,0) tiretée bleue
  ctx.beginPath(); ctx.strokeStyle='#378ADD66'; ctx.lineWidth=1.5; ctx.setLineDash([5,5]);
  for(let px=0;px<=W;px++){const u=(px-W/2)/sc; const y=cy-waveFunc(u,shape,A,k); px===0?ctx.moveTo(px,y):ctx.lineTo(px,y);}
  ctx.stroke(); ctx.setLineDash([]);

  // f(x-vt) profil décalé orange
  ctx.beginPath(); ctx.strokeStyle='#D85A30'; ctx.lineWidth=2.5;
  for(let px=0;px<=W;px++){const u=(px-W/2)/sc - v*t*0.03; const y=cy-waveFunc(u,shape,A,k); px===0?ctx.moveTo(px,y):ctx.lineTo(px,y);}
  ctx.stroke();

  // flèche vt
  const shift=v*t*0.03*sc;
  if(Math.abs(shift)>4){
    const ay=cy-A-36;
    const x0=W/2, x1=W/2+shift;
    ctx.beginPath(); ctx.strokeStyle='#1D9E75'; ctx.lineWidth=1.8;
    ctx.moveTo(x0,ay); ctx.lineTo(x1,ay); ctx.stroke();
    const d=shift>0?1:-1;
    ctx.beginPath(); ctx.fillStyle='#1D9E75';
    ctx.moveTo(x1+d*8,ay); ctx.lineTo(x1-d*4,ay-5); ctx.lineTo(x1-d*4,ay+5); ctx.closePath(); ctx.fill();
    // ligne verticale tiretée depuis x0 et x1
    ctx.strokeStyle='#1D9E7555'; ctx.lineWidth=0.8; ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(x0,ay+8); ctx.lineTo(x0,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1,ay+8); ctx.lineTo(x1,cy); ctx.stroke();
    ctx.setLineDash([]);
    // label vt
    ctx.fillStyle='#1D9E75'; ctx.font='500 12px Mulish,system-ui,sans-serif'; ctx.textAlign='center';
    ctx.fillText('vt = '+(v*t*0.03).toFixed(2), (x0+x1)/2, ay-10);
  }

  // labels dans le canvas — bien écartés verticalement
  const labelY0 = cy - A - 60;   // f(x,0) au dessus
  const labelYt = labelY0 - 22;  // f(x−vt) encore au dessus

  ctx.font='500 13px Mulish,system-ui,sans-serif'; ctx.textAlign='left';
  ctx.fillStyle='#D85A30';
  ctx.fillText('f(x−vt)', 14, labelYt);
  ctx.fillStyle='#378ADD99';
  ctx.fillText('f(x, 0)', 14, labelY0);
}

function loop(ts){
  if(!playing) return;
  if(!lastTs) lastTs=ts;
  // vitesse d'écoulement du temps augmentée (×1.5)
  const dt=(ts-lastTs)/16*1.5;
  lastTs=ts;
  animT+=dt;
  if(animT>400) animT=0;
  document.getElementById('tsl').value=animT;
  document.getElementById('tslv').textContent=Math.round(animT);
  draw(animT);
  raf=requestAnimationFrame(loop);
}

draw(0);
</script>
<footer class="sfa-foot">Science For All · simulations interactives</footer>
</body>
</html>
